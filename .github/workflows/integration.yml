name: Varnish integration lab
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Validate Compose configuration
        run: docker compose config -q
      - name: Build origins
        run: docker compose build
      - name: Start origins and Varnish
        run: docker compose up -d varnish
      - name: Compile VCL
        run: docker compose exec -T varnish varnishd -C -f /etc/varnish/default.vcl 2>/tmp/varnish-vcl-compile.log || { cat /tmp/varnish-vcl-compile.log; exit 1; }
      - name: Wait for readiness and run integration tests
        run: docker compose run --rm test-runner
      - name: Collect diagnostics on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color
      - name: Clean up
        if: always()
        run: docker compose down --volumes --remove-orphans
